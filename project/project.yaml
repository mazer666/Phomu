# Open decisions of the owner. The complete, prioritised list is in the
# handover document of the Product Manager; here only the short form.
open_owner_decisions:
  - id: "D-1"
    topic: "Milestone numbering after the reform"
    question: "Do M0–M8 from roadmap phase 1–5 remain, or does M3
      (documentation reform) become M0 as the new beginning?"
  - id: "D-2"
    topic: "Relation of MILESTONE and PRODUCT_STATUS"
    question: "product_status is running text derived from the milestone
      statuses. Should a pure token scheme (complete/in-progress/planned) be
      used instead?"
  - id: "D-3"
    topic: "Admin-API"
    question: "The admin routes are not in the route tree and cannot run
      under a static export. Should the admin API be dropped, moved to a Node
      server, or relocated into the export as a build step?"
  - id: "D-4"
    topic: "Coverage target"
    question: "Is the target of 60 % lines for the coverage scope
      src/utils/** correct, or should the scope first be extended to
      store/components?"
