    gate_command: "npm run check:file-size"
    # Ausgangslage des Gates: 0 Fehler, 8 Warnungen, 7 dokumentierte Altlasten
    # (gemessen 2026-10-25T08:58:43Z, ROADMAP.md GAP-11).
