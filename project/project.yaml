# Phomu — machine-readable project state
#
# This file is the SINGLE source of truth for values that several documents
# concern (status, milestones, thresholds, requirement counts).
# The root documents (ROADMAP.md, REQUIREMENTS.md, ARCHITECTURE.md, QUALITY.md)
# point here and do not repeat any number without a source.
#
# Rule for every line: a value is here because it was measured or derived.
# Where something is unknown, `null` stands with a comment — not a plausible
# number.
#
# As of: 2026-10-25, branch feature/vocument-style-docs-and-i18n, commit d5b6422

project:
  name: "Phomu"
  description: "Hybrid music party game: physical QR cards plus web app."
  baseline_version: "0.1"

  # Short status for tooling. Composed from completed_milestones and
  # milestones[].status (see below).
  product_status: "m0-complete-m1-in-progress-m2-in-progress-m3-in-progress"

  current_milestone: "M3"
  current_milestone_name: "Documentation, requirement and i18n reform"

  # Only milestones whose gates are fully met and evidenced.
  # Baseline: ROADMAP.md, section "QA evidence" per milestone.
  completed_milestones:
    - "M0"

  # Milestones that have started but still have at least one open gate.
  in_progress_milestones:
    - "M1"
    - "M2"
    - "M3"
    - "M6"

  license: "GPL-3.0-or-later"
  # No DCO or CLA process is documented in the repository:
  # grep -i "DCO|Developer Certificate" over the root documents finds nothing.
  contribution_model: null

  languages:
    documentation: "de"
    code_and_identifiers: "en"
    user_interface_primary: "de"
    user_interface_secondary: "en"

platforms:
  web:
    kind: "responsive web application"
    framework: "Next.js 16 (App Router), React 19, TypeScript strict, Tailwind CSS 4"
    rendering: "static export (next.config.ts: output 'export')"
    base_path: "/Phomu"
    routing:
      registered_routes: 23
      # Source: .next/app-path-routes-manifest.json (23 entries, build of 2026-10-25)
      note: "The admin API handlers live under src/admin-api/ and are not
        registered by the App Router; a static export cannot execute route
        handlers in any case. See ROADMAP.md, gap GAP-22."
  mobile:
    kind: "the same web application, designed mobile-first"
    native_app: false
    evidence:
      - "src/app/layout.tsx — viewport: width device-width, viewportFit 'cover'"
      - "src/app/globals.css:109-139 — CSS variables --sat/--sar/--sab/--sal
        and utility classes .pt-safe/.pb-safe/.pl-safe/.pr-safe"
    # No device or browser matrix exists (ROADMAP.md, GAP-08).
    tested_device_matrix: null
  deployment:
    target: "GitHub Pages"
    pipeline: ".github/workflows/deploy.yml"
    trigger: "Push to main or manual start (workflow_dispatch)"
    # The workflow runs not a single quality gate (no typecheck, lint, test or
    # build gate). See ROADMAP.md, gap GAP-18.
    quality_gates_in_pipeline: []
  supported_browsers:
    # No browser matrix is documented and no browserslist configuration exists.
    # What can be evidenced is only which browser was actually used in the E2E
    # run.
    e2e_browser: "chromium (Playwright 1.59.1, playwright.config.ts)"
    documented_matrix: null

modules:
  # Dependency direction: each entry may only access the areas named below.
  # "Must not depend on" is the hard limit.
  - name: "config"
    path: "src/config/"
    responsibility: >
      All game constants: modes, points, limits, themes, languages, spoiler
      exceptions, year range of the catalogue. One number, one place.
    may_depend_on: []
    must_not_depend_on: ["types", "data", "utils", "stores", "hooks", "components", "app", "i18n"]
  - name: "types"
    path: "src/types/"
    responsibility: "Type definitions for players, teams, session, game state, song, music provider."
    may_depend_on: ["config"]
    must_not_depend_on: ["data", "utils", "stores", "hooks", "components", "app"]
  - name: "data"
    path: "src/data/"
    responsibility: "Song catalogue as JSON packs plus a generated loader (src/data/songs/index.ts)."
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["utils", "stores", "hooks", "components", "app"]
  - name: "utils"
    path: "src/utils/"
    responsibility: >
      Pure functions without React dependencies: schema and catalogue
      validation, song selection, QR intent parsing, spoiler censorship, audio
      cue paths, feedback and round messages.
    may_depend_on: ["config", "types", "data"]
    must_not_depend_on: ["stores", "hooks", "components", "app"]
  - name: "stores"
    path: "src/stores/"
    responsibility: >
      Zustand game state (lobby, players, teams, rounds, points, history),
      persisted in localStorage under the key 'phomu-game-state'.
    may_depend_on: ["config", "types", "utils"]
    must_not_depend_on: ["hooks", "components", "app"]
  - name: "hooks"
    path: "src/hooks/"
    responsibility: "React hooks with side effects (currently useGameAudioCues)."
    may_depend_on: ["config", "types", "utils", "stores"]
    must_not_depend_on: ["components", "app"]
  - name: "contexts"
    path: "src/contexts/"
    responsibility: "ThemeContext: active design, stored in localStorage, as data-theme on <html>."
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["stores", "components", "app"]
  - name: "i18n"
    path: "src/i18n/"
    responsibility: >
      i18next configuration, language detection, locale files de.json and en.json.
      The translation happens at this boundary, not in the components.
    may_depend_on: []
    must_not_depend_on: ["stores", "components", "app"]
  - name: "components"
    path: "src/components/"
    responsibility: "User interface: game phases, game modes, lobby, browse, admin tools, UI building blocks."
    may_depend_on: ["config", "types", "data", "utils", "stores", "hooks", "contexts", "i18n"]
    must_not_depend_on: ["app"]
  - name: "app"
    path: "src/app/"
    responsibility: "Next.js routes (pages), layout, global stylesheet, themes."
    may_depend_on: ["config", "types", "data", "utils", "stores", "hooks", "contexts", "components", "i18n"]
    must_not_depend_on: []
  - name: "admin-api"
    path: "src/admin-api/"
    responsibility: >
      Admin endpoints for cover search and cover storage including the token
      guard. Not registered in the App Router (see platforms.web.routing.note).
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["components", "app"]

