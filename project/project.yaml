# Phomu — maschinenlesbarer Projektzustand
#
# Diese Datei ist die EINZIGE Wahrheit für Werte, die mehrere Dokumente
# betreffen (Status, Meilensteine, Schwellen, Anforderungszahlen).
# Die Root-Dokumente (ROADMAP.md, REQUIREMENTS.md, ARCHITECTURE.md, QUALITY.md)
# verweisen hierher und wiederholen keine Zahlen ohne Quelle.
#
# Regel für jede Zeile: ein Wert steht hier, weil er gemessen oder abgeleitet
# wurde. Wo etwas unbekannt ist, steht `null` mit einem Kommentar — nicht eine
# plausible Zahl.
#
# Stand: 2026-10-25, Branch feature/vocument-style-docs-and-i18n, Commit d5b6422

project:
  name: "Phomu"
  description: "Hybrides Musik-Partyspiel: physische QR-Karten plus Web-App."
  baseline_version: "0.1"

  # Kurzstatus für Werkzeuge. Setzt sich aus completed_milestones und
  # milestones[].status zusammen (siehe unten).
  product_status: "m0-complete-m1-in-progress-m2-in-progress-m3-in-progress"

  current_milestone: "M3"
  current_milestone_name: "Doku-, Anforderungs- und i18n-Reform"

  # Nur Meilensteine, deren Gates vollständig erfüllt und belegt sind.
  # Grundlage: ROADMAP.md, Abschnitt "QA-Evidenz" je Meilenstein.
  completed_milestones:
    - "M0"

  # Meilensteine, die begonnen sind, aber mindestens ein offenes Gate haben.
  in_progress_milestones:
    - "M1"
    - "M2"
    - "M3"
    - "M6"

  license: "GPL-3.0-or-later"
  # Kein DCO- oder CLA-Prozess im Repository dokumentiert:
  # grep -i "DCO|Developer Certificate" über die Root-Dokumente findet nichts.
  contribution_model: null

  languages:
    documentation: "de"
    code_and_identifiers: "en"
    user_interface_primary: "de"
    user_interface_secondary: "en"

platforms:
  web:
    kind: "responsive web application"
    framework: "Next.js 16 (App Router), React 19, TypeScript strict, Tailwind CSS 4"
    rendering: "static export (next.config.ts: output 'export')"
    base_path: "/Phomu"
    routing:
      registered_routes: 23
      # Quelle: .next/app-path-routes-manifest.json (23 Einträge, Build vom 2026-10-25)
      note: "Die Admin-API-Handler liegen unter src/admin-api/ und werden vom
        App Router nicht registriert; ein Static Export kann Route-Handler
        ohnehin nicht ausführen. Siehe ROADMAP.md, Lücke GAP-22."
  mobile:
    kind: "dieselbe Web-Anwendung, mobilfirst gestaltet"
    native_app: false
    evidence:
      - "src/app/layout.tsx — viewport: width device-width, viewportFit 'cover'"
      - "src/app/globals.css:109-139 — CSS-Variablen --sat/--sar/--sab/--sal
        und Utility-Klassen .pt-safe/.pb-safe/.pl-safe/.pr-safe"
    # Es existiert keine Geräte- oder Browser-Matrix (ROADMAP.md, GAP-08).
    tested_device_matrix: null
  deployment:
    target: "GitHub Pages"
    pipeline: ".github/workflows/deploy.yml"
    trigger: "Push auf main oder manueller Start (workflow_dispatch)"
    # Die Workflow führt kein einziges Qualitätsgate aus (kein typecheck,
    # lint, test, build-Gate). Siehe ROADMAP.md, Lücke GAP-18.
    quality_gates_in_pipeline: []
  supported_browsers:
    # Es ist keine Browser-Matrix dokumentiert und keine browserslist-
    # Konfiguration vorhanden. Belegbar ist nur, welcher Browser im E2E-Lauf
    # tatsächlich verwendet wurde.
    e2e_browser: "chromium (Playwright 1.59.1, playwright.config.ts)"
    documented_matrix: null

modules:
  # Abhängigkeitsrichtung: jeder Eintrag darf nur auf die darunter genannten
  # Bereiche zugreifen. „Darf nicht dependieren von" ist die harte Grenze.
  - name: "config"
    path: "src/config/"
    responsibility: >
      Alle Spielkonstanten: Modi, Punkte, Grenzwerte, Themes, Sprachen,
      Spoiler-Ausnahmen, Jahresbereich des Katalogs. Eine Zahl, eine Stelle.
    may_depend_on: []
    must_not_depend_on: ["types", "data", "utils", "stores", "hooks", "components", "app", "i18n"]
  - name: "types"
    path: "src/types/"
    responsibility: "Typdefinitionen für Spieler, Teams, Sitzung, Spielzustand, Song, Musikprovider."
    may_depend_on: ["config"]
    must_not_depend_on: ["data", "utils", "stores", "hooks", "components", "app"]
  - name: "data"
    path: "src/data/"
    responsibility: "Song-Katalog als JSON-Packs plus generierter Loader (src/data/songs/index.ts)."
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["utils", "stores", "hooks", "components", "app"]
  - name: "utils"
    path: "src/utils/"
    responsibility: >
      Reine Funktionen ohne React-Abhängigkeit: Schema- und Katalogvalidierung,
      Song-Auswahl, QR-Intent-Parsing, Spoiler-Zensur, Audio-Cue-Pfade,
      Feedback- und Rundenmeldungen.
    may_depend_on: ["config", "types", "data"]
    must_not_depend_on: ["stores", "hooks", "components", "app"]
  - name: "stores"
    path: "src/stores/"
    responsibility: >
      Zustand-Spielzustand (Lobby, Spieler, Teams, Runden, Punkte, Verlauf),
      persistiert in localStorage unter dem Schlüssel 'phomu-game-state'.
    may_depend_on: ["config", "types", "utils"]
    must_not_depend_on: ["hooks", "components", "app"]
  - name: "hooks"
    path: "src/hooks/"
    responsibility: "React-Hooks mit Seiteneffekt (derzeit useGameAudioCues)."
    may_depend_on: ["config", "types", "utils", "stores"]
    must_not_depend_on: ["components", "app"]
  - name: "contexts"
    path: "src/contexts/"
    responsibility: "ThemeContext: aktives Design, gespeichert in localStorage, als data-theme am <html>."
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["stores", "components", "app"]
  - name: "i18n"
    path: "src/i18n/"
    responsibility: >
      i18next-Konfiguration, Spracherkennung, Locale-Dateien de.json und en.json.
      Die Übersetzung passiert an dieser Grenze, nicht in den Komponenten.
    may_depend_on: []
    must_not_depend_on: ["stores", "components", "app"]
  - name: "components"
    path: "src/components/"
    responsibility: "Oberfläche: Spielphasen, Spielmodi, Lobby, Browse, Admin-Werkzeuge, UI-Bausteine."
    may_depend_on: ["config", "types", "data", "utils", "stores", "hooks", "contexts", "i18n"]
    must_not_depend_on: ["app"]
  - name: "app"
    path: "src/app/"
    responsibility: "Next.js-Routen (Seiten), Layout, globales Stylesheet, Themes."
    may_depend_on: ["config", "types", "data", "utils", "stores", "hooks", "contexts", "components", "i18n"]
    must_not_depend_on: []
  - name: "admin-api"
    path: "src/admin-api/"
    responsibility: >
      Admin-Endpunkte für Cover-Suche und Cover-Speicherung samt Token-Guard.
      Nicht im App-Router registriert (siehe platforms.web.routing.note).
    may_depend_on: ["config", "types"]
    must_not_depend_on: ["components", "app"]

