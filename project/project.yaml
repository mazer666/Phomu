# Platform tracks — the multi-platform expansion (2026-10-25).
#
# One product, one shared Rust core, platform-specific frontends. The web
# application stays and becomes a first-class shell; it is not replaced.
#
# The order below is BINDING: a track only starts once the previous one has
# a green release candidate. See
# docs/adr/ADR-0006-binding-platform-track-order.md
platform_tracks:
  order:
    - "android"
    - "tv-android"
    - "macos-linux"
    - "ios-ipados"
    - "windows"
  shared_core:
    language: "Rust"
    design: "docs/design/PLATFORM-ARCHITECTURE.md"
    build_contract: "docs/design/BUILD-CONTRACT.md"
    decision: "docs/adr/ADR-0005-shared-rust-core-with-platform-frontends.md"
    rule: "The core owns the rules; the shells own the rendering. No shell
      re-implements a rule."
  release_stages:
    - "alpha"
    - "beta"
    - "stable"
  release_plan: "docs/releases/RELEASE-PLAN.md"
  release_checklist: "docs/releases/RELEASE-CHECKLIST.md"
  specification:
    srs: "docs/spec/SRS.md"
    requirements: "docs/spec/REQUIREMENTS-PLATFORM.md"
    traceability: "docs/spec/TRACEABILITY.md"
  foundation:
    milestone: "P0 — Platform foundation"
    status: "COMPLETE"
    acceptance: "docs/acceptance/P0-ACCEPTANCE.md"
    rust_workspace: "Cargo.toml"
    crates:
      core: 7
      platform: 3
      tools: 4
    conformance:
      vectors_total: 70
      portable_compared: 64
      identical: 36
      deviating: 0
      intentional_deviations: 28
      documented_divergences: 6
      gate: "npm run check:conformance"
    measured:
      rust_tests: 304
      rust_clippy: "clean (-D warnings)"
      rust_fmt: "clean"
      rust_doc: "builds without warning"
  tracks:
    web:
      name: "Web"
      order: 0
      role: "First-class shell, not replaced by the native apps"
      frontend: "Next.js 16 (App Router), React 19, TypeScript strict"
      distribution: "static export to GitHub Pages"
      status: "ACTIVE"
      note: "The web shell is the reference implementation of the product
        surface and the fallback for every platform."
    android:
      name: "Android (phone and tablet)"
      order: 1
      frontend: "Kotlin + Jetpack Compose"
      distribution: "Google Play"
      status: "PLANNED"
    tv-android:
      name: "Google TV / Fire TV"
      order: 2
      frontend: "Kotlin + Jetpack Compose for TV"
      distribution: "Google Play"
      status: "PLANNED"
    macos-linux:
      name: "macOS and Linux"
      order: 3
      frontend: "Rust + egui (desktop shell), macOS and Linux in one track"
      distribution: "macOS: signed and notarised app bundle; Linux: AppImage"
      status: "PLANNED"
    ios-ipados:
      name: "iPadOS and iOS"
      order: 4
      frontend: "Swift + SwiftUI over the UniFFI bridge"
      distribution: "App Store / TestFlight — subject to the licensing
        decision, see docs/licensing/APPLE-LICENSING.md"
      status: "PLANNED"
      blocked_by:
        - "No Apple Developer Program account yet (owner will obtain one)"
        - "Licensing decision pending: docs/adr/ADR-0007-apple-distribution-and-licensing-strategy.md"
    windows:
      name: "Windows and further operating systems"
      order: 5
      frontend: "Rust + egui (desktop shell)"
      distribution: "MSIX"
      status: "PLANNED"


quality_thresholds:
  file_size:
    soft_limit_lines: 400
    hard_limit_lines: 550
    scope: "src/**/*.{ts,tsx}"
    gate_script: "scripts/check-file-size.mjs"
    gate_script_exists: true
    gate_command: "npm run check:file-size"
    # Baseline of the gate: 0 errors, 8 warnings, 7 documented legacy items
    # (measured 2026-10-25T08:58:43Z, ROADMAP.md GAP-11).
    measured_at: "2026-10-25T08:58:43Z"
    measured_errors: 0
    measured_warnings: 8
    documented_exceptions: 7
    current_violations:
      over_hard_limit:
        - "src/app/lobby/page.tsx (801)"
        - "src/app/admin/review/page.tsx (767)"
        - "src/components/game/MusicPlayer.tsx (641)"
        - "src/stores/game-store.ts (640)"
        - "src/components/game/modes/TimelineMode.tsx (617)"
        - "src/components/game/RevealPhase.tsx (596)"
        - "src/app/browse/page.tsx (575)"
      over_soft_limit:
        - "src/utils/validate-song-data.ts (502)"
        - "src/app/game/page.tsx (468)"
        - "src/app/admin/songs/page.tsx (461)"
  test_coverage:
    # Target values. The current state is below them; that is an open gap
    # (ROADMAP.md, GAP-06), not a reason to lower the target.
    target_lines_percent: 60
    target_branches_percent: 50
    target_statements_percent: 60
    # Current state from `npm run test` (2026-10-25). The coverage scope of the
    # Vitest configuration covers only src/utils/** (vitest.config.ts).
    # Measured at commit d5b6422 (isolated) and in the working tree.
    measured_lines_percent: 24.94
    measured_branches_percent: 28.4
    measured_statements_percent: 23.29
    measured_scope: "src/utils/**/*.ts"
    measured_at: "2026-10-25 (commit d5b6422)"
    measured_working_tree:
      lines_percent: 33.77
      branches_percent: 34.6
      statements_percent: 32.33
      test_files: 10
      tests: 97
      measured_at: "2026-10-25T08:41:51Z"
    coverage_scope_is_complete: false
  i18n_completeness:
    required_ratio: 1.0
    meaning: "every key exists in de.json and en.json, no empty value,
      plural forms identical in both languages, no visible literal text in the
      JSX"
    gate_script: "scripts/check-i18n-completeness.mjs"
    gate_script_exists: true
    # Current state 2026-10-25T08:59Z: 6 literal texts in 47 files are still
    # not translated (ROADMAP.md, GAP-09). At the start of the round there
    # were 935 (2026-10-25T08:34:52Z).
    measured_literal_texts: 6
    measured_files_with_literals: 47
    measured_at: "2026-10-25T08:59Z"
    measured_at_round_start: "2026-10-25T08:34:52Z"
    measured_literal_texts_at_round_start: 935
  gates:
    typecheck: "npm run typecheck"
    lint: "npm run lint"
    unit_tests: "npm run test"
    build: "npm run build"
    song_validation: "npm run validate-songs"
    catalog_validation: "npm run validate-catalog"
    e2e_smoke: "npm run test:e2e:smoke"
    dependency_audit: "npm audit --omit=dev --audit-level=moderate"
    i18n_completeness: "npm run check:i18n"
    doc_links: "npm run check:doc-links"
    file_size: "npm run check:file-size"
    all_new_gates: "npm run check:all"
    local_ci: "npm run local-ci"

