# Offene Entscheidungen des Owners. Die vollständige, priorisierte Liste
# steht im Übergabedokument des Product Managers; hier nur die Kurzform.
open_owner_decisions:
  - id: "D-1"
    topic: "Meilenstein-Nummerierung nach der Reform"
    question: "Bleiben M0–M8 aus der Roadmap-Phase 1–5 erhalten, oder wird
      M3 (Doku-Reform) als M0 zum neuen Anfang?"
  - id: "D-2"
    topic: "Verhältnis von MEILENSTEIN und PRODUCT_STATUS"
    question: "product_status ist ein Fließtext aus den Meilensteinstatus.
      Soll stattdessen ein reines Token-Schema (complete/in-progress/planned)
      verwendet werden?"
  - id: "D-3"
    topic: "Admin-API"
    question: "Die Admin-Routen sind nicht im Route-Baum und können unter
      Static Export nicht laufen. Soll die Admin-API entfallen, auf einen
      Node-Server umgestellt oder als Build-Schritt in den Export verlagert
      werden?"
  - id: "D-4"
    topic: "Coverage-Ziel"
    question: "Ist das Ziel von 60 % Lines für den Coverage-Scope
      src/utils/** richtig, oder soll der Scope zuerst auf store/components
      erweitert werden?"
