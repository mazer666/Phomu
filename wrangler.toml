# Cloudflare Pages — the configuration of the web shell
#
# WHY: the web shell is a static export, and a static export on GitHub Pages
# cannot set the security headers. Cloudflare Pages can: it reads them from
# `public/_headers`, which is generated from the same list the Next.js server
# uses. The hosting decision is recorded in
# `docs/adr/ADR-0010-hosting-on-cloudflare-pages.md`.
#
# The name of the Pages project. It decides the address
# `phomu.pages.dev` and has to match the account exactly — the
# workflow checks the name against the account before the upload and lists
# the projects that do exist. Change it together with the
# `NEXT_PUBLIC_BASE_PATH` of the build.

name = "phomu"
compatibility_date = "2026-10-01"

# The build of the Cloudflare Pages project.
#
# WHY the toolchain is installed first: the web shell loads the shared Rust
# base as a WebAssembly module, and the module has to be built before the
# shell can resolve the import. The build image of the Pages service does not
# carry a Rust toolchain, so the build installs it itself.
#
# The GitHub Actions workflow (`.github/workflows/deploy-cloudflare.yml`) uses
# `dtolnay/rust-toolchain` instead and does not need this script.
[build]
command = "bash scripts/install-rust-toolchain.sh && npm run build"
output_dir = "out"

# The static export of Next.js. The build writes it here.
pages_build_output_dir = "out"

# The variables of the build. The shell is served from the root of the
# project, so the base path is empty — on GitHub Pages it was `/Phomu`.
[vars]
NEXT_PUBLIC_BASE_PATH = ""

# The environment of the production. The build reads it, and the runtime
# reads the base path out of the bundle.
[env.production]
NEXT_PUBLIC_BASE_PATH = ""
