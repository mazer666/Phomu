# Deploy the web shell to GitHub Pages
#
# WHY the deployment waits for the CI: the CI is the binding technical
# acceptance of the repository. A deployment that runs on the push alone
# publishes a state that nobody checked — a broken format, a broken build
# or a broken shell would go live. The trigger is therefore the *completion*
# of the CI, and the job only runs when that run was green.
#
# WHY the commit of the run is checked out and not the tip of the branch:
# the trigger fires when the CI *finishes*, and the branch may have moved
# on in the meantime. The deployment has to publish exactly the state the
# CI verified — not a newer one, and not an older one.
#
# WHY the order of the deployments is the order of the commits: the CI
# uses a concurrency group per branch without cancellation, so two CI runs
# on the same branch run one after the other, and their completion events
# arrive in the order of the commits. This workflow uses a concurrency group
# of its own, also without cancellation — the deployments therefore wait
# for each other and the newest verified state is the last one published.

name: Deploy Next.js site to Pages

on:
  # The deployment follows a finished CI run on the default branch.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # WHY the condition: the trigger fires for every finished CI run, also
    # for the red ones. Only a green run may become a deployment; a manual
    # run always may.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # The commit the deployment publishes. For the automatic run it is the
      # commit the CI verified; for the manual run it is the tip of the
      # branch.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The verified commit, not the tip of the branch.
          ref: ${{ env.DEPLOY_SHA }}
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/package.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/package.json') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      # The web shell loads the shared base over WebAssembly. The module is
      # built from the Rust workspace, so the toolchain and the wasm32 target
      # have to be there before the Next.js build resolves the import.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-wasm.mjs
      # `npm run build` and not `npx next build`: the package script runs the
      # prebuild step, and that is the one that makes sure the WebAssembly
      # module exists — also on a checkout where nobody built it before.
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.manager }} run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
