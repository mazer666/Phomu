# Deploy the web shell to Cloudflare Pages
#
# WHY a workflow and not the Pages Git integration: the build needs the
# Rust toolchain — the shell loads the shared base as a WebAssembly module
# — and the Pages build image does not have it. The workflow builds the
# module and the shell and hands the result to `wrangler pages deploy`.
#
# The secrets it needs (set them in the repository settings):
#   CLOUDFLARE_API_TOKEN  — a token with the permission "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the id of the account (dashboard → Workers & Pages)
#
# WHY the credentials are read in a step and not in the job condition:
# GitHub evaluates the condition of a job before the secrets exist, and
# rejects a workflow file that reads `secrets` there. The secret therefore
# goes into the environment of the job, and the step reads it from there.
#
# Without a token the workflow skips itself — the repository stays usable
# without a Cloudflare account.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'core/**'
      - 'platform/**'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'wrangler.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The name of the Pages project. It is a variable, not a constant,
      # because the project name is chosen in the dashboard and has to match
      # the account exactly — a name that does not exist fails with
      # "Project not found" (code 8000007). The fallback is the project of
      # this account; the workflow checks the name before the upload and
      # lists the projects that do exist.
      #
      # WHY the name and the address are two things: the address of a Pages
      # project is fixed when the project is created — the subdomain cannot
      # be changed afterwards (the known issues of the Pages documentation).
      # A project that carries the wanted name but serves the wrong address
      # therefore gives the name back, and the upload creates the project
      # with the wanted name — and with the address that belongs to it.
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'phomu' }}
      # The name the project of this account was created under. It is the
      # name the project gets back when it carries the wanted name but the
      # wrong address.
      CLOUDFLARE_LEGACY_PROJECT_NAME: ${{ vars.CLOUDFLARE_LEGACY_PROJECT_NAME || 'supermazerworld' }}
    steps:
      - name: Check the credentials
        id: credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials in the repository settings — the deployment is skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        if: steps.credentials.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Build the WebAssembly module of the shared base
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/build-wasm.mjs

      - name: Build the shell
        if: steps.credentials.outputs.available == 'true'
        # The shell is served from the root of the Pages project, so the
        # base path is empty here. On GitHub Pages it was `/Phomu`.
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build

      - name: Check the security headers
        if: steps.credentials.outputs.available == 'true'
        # The `_headers` file has to match the source of truth, otherwise
        # the deployed site would be protected differently from the source.
        run: node scripts/generate-cloudflare-headers.mjs --check

      - name: Prepare the project
        id: project
        if: steps.credentials.outputs.available == 'true'
        # WHY: the address of a Pages project is fixed when the project is
        # created — the subdomain cannot be changed afterwards (the known
        # issues of the Pages documentation). A project that was renamed
        # keeps its old address, so it can carry the wanted name without
        # serving the wanted address.
        #
        # The step decides which project the upload goes to:
        #   1. the wanted name and the wanted address → that project
        #   2. the wanted name and the wrong address → the name goes back,
        #      the project is created anew (and the address belongs to it)
        #   3. the wanted name is free → the project is created
        #   4. the project cannot be created → the project that exists is
        #      used, and the reason is reported as an annotation. The
        #      deployment never fails because of an address.
        run: |
          target="${CLOUDFLARE_PROJECT_NAME}"
          legacy="${CLOUDFLARE_LEGACY_PROJECT_NAME}"
          # Every step is its own shell: the list of the projects has to be
          # asked for again here.
          projects=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
          echo "${projects}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("The projects of this account: "+(j.result||[]).map(p=>`${p.name} (${p.subdomain||"?"})`).join(", "))})'
          field=$(echo "${projects}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const p=(j.result||[]).find(x=>x.name===process.argv[1]);console.log(p?`${p.subdomain||""}`:"")})' "${target}")
          if [ "${field}" = "${target}.pages.dev" ]; then
            echo "The project '${target}' serves '${field}' — the upload goes there."
            echo "name=${target}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${field}" ]; then
            # The name is taken by a project with the wrong address: the name
            # goes back to the legacy name, so that the wanted name can be
            # used again.
            taken=$(echo "${projects}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const p=(j.result||[]).find(x=>x.name===process.argv[1]);console.log(p?"taken":"free")})' "${legacy}")
            if [ "${taken}" = "free" ]; then
              echo "The project '${target}' serves '${field}' — the name goes back to '${legacy}'."
              # WHY the payload in a variable: the escaped quotes of a JSON
              # document are unescaped twice inside a command substitution —
              # the shell would read the payload as broken quotes.
              payload=$(printf '{"name":"%s"}' "${legacy}")
              renamed=$(curl -sS -X PATCH \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${payload}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${target}")
              echo "${renamed}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.success?"The name is free.":"::error::The rename failed: "+JSON.stringify(j.errors));process.exit(j.success?0:1)})'
            fi
          fi
          # The wanted name is free: the project is created. The creation is
          # a separate command, so that a token that may not create projects
          # is reported instead of failing the upload with a short message.
          payload=$(printf '{"name":"%s","production_branch":"main"}' "${target}")
          created=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
          ok=$(echo "${created}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).success)}catch{console.log("unknown")}})')
          if [ "${ok}" = "true" ]; then
            echo "The project '${target}' was created — the upload goes there."
            echo "name=${target}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason=$(echo "${created}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify(j.errors||j))})')
          echo "::error::The project '${target}' could not be created: ${reason}"
          echo "::notice::Create the project in the dashboard (Workers and Pages) and give the repository the variable CLOUDFLARE_PROJECT_NAME — then the upload goes to it."
          # The deployment does not fail because of an address: the project
          # that exists is used.
          fallback=$(echo "${projects}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const p=(j.result||[]).find(x=>x.name===process.argv[1]);console.log(p?p.name:"")})' "${legacy}")
          if [ -z "${fallback}" ]; then
            echo "::error::Neither the new project nor the project of the account could be used."
            exit 1
          fi
          echo "The upload goes to the project '${fallback}' — it serves '${fallback}.pages.dev'."
          echo "name=${fallback}" >> "$GITHUB_OUTPUT"

      - name: Upload the Pages artefact
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ steps.project.outputs.name }} --branch=main
