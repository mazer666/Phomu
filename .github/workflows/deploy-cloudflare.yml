# Deploy the web shell to Cloudflare Pages
#
# WHY a workflow and not the Pages Git integration: the build needs the
# Rust toolchain — the shell loads the shared base as a WebAssembly module
# — and the Pages build image does not have it. The workflow builds the
# module and the shell and hands the result to `wrangler pages deploy`.
#
# The secrets it needs (set them in the repository settings):
#   CLOUDFLARE_API_TOKEN  — a token with the permission "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the id of the account (dashboard → Workers & Pages)
#
# WHY the credentials are read in a step and not in the job condition:
# GitHub evaluates the condition of a job before the secrets exist, and
# rejects a workflow file that reads `secrets` there. The secret therefore
# goes into the environment of the job, and the step reads it from there.
#
# Without a token the workflow skips itself — the repository stays usable
# without a Cloudflare account.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'core/**'
      - 'platform/**'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'wrangler.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The name of the Pages project. It is a variable, not a constant,
      # because the project name is chosen in the dashboard and has to match
      # the account exactly — a name that does not exist fails with
      # "Project not found" (code 8000007). The fallback is the project of
      # this account; the workflow checks the name before the upload and
      # lists the projects that do exist.
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'supermazerworld' }}
    steps:
      - name: Check the credentials
        id: credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials in the repository settings — the deployment is skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust toolchain
        if: steps.credentials.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Build the WebAssembly module of the shared base
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/build-wasm.mjs

      - name: Build the shell
        if: steps.credentials.outputs.available == 'true'
        # The shell is served from the root of the Pages project, so the
        # base path is empty here. On GitHub Pages it was `/Phomu`.
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build

      - name: Check the security headers
        if: steps.credentials.outputs.available == 'true'
        # The `_headers` file has to match the source of truth, otherwise
        # the deployed site would be protected differently from the source.
        run: node scripts/generate-cloudflare-headers.mjs --check

      - name: Check the project
        if: steps.credentials.outputs.available == 'true'
        # WHY: a name that does not exist in the account fails with
        # "Project not found" (code 8000007) and the list of the projects that
        # do exist turns the guesswork into a fact.
        run: |
          response=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
          ok=$(echo "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).success)}catch{console.log("unknown")}})')
          if [ "${ok}" != "true" ]; then
            echo "::error::The account ${CLOUDFLARE_ACCOUNT_ID} did not answer. Check the account id."
            exit 1
          fi
          found=$(echo "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result||[]).map(p=>p.name).join(", "))})')
          echo "The projects of this account: ${found}"
          if ! echo ",${found}," | grep -q ",${CLOUDFLARE_PROJECT_NAME},"; then
            echo "::error::The project '${CLOUDFLARE_PROJECT_NAME}' does not exist. Set the repository variable CLOUDFLARE_PROJECT_NAME to one of: ${found}"
            exit 1
          fi
          echo "The project '${CLOUDFLARE_PROJECT_NAME}' exists."

      - name: Upload the Pages artefact
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main
