# Phomu — CI (Continuous Integration)
#
# This workflow is the binding technical acceptance. Every job checks
# exactly one property and fails on a real violation.
# There is deliberately no `|| true` in a step: a violation has to turn the
# job red. The single exception is the `format` job, which is marked
# `continue-on-error: true` and therefore does not block the pipeline yet —
# the comment on that job states when the exception ends.
#
# Gates (CONTRACT.md §6, QUALITY.md §2):
#   - Typecheck          -> scripts: typecheck
#   - Lint               -> scripts: lint
#   - Unit Tests         -> scripts: test (Vitest + Coverage)
#   - End-to-End Smoke   -> scripts: test:e2e:smoke (Playwright)
#   - Catalog Validation -> scripts: validate-songs, validate-catalog
#   - Quality Gates      -> scripts: check:i18n, check:doc-links, check:file-size,
#                         check:doc-language, check:license, check:link-match:test
#   - Rust Core           -> cargo build, test, clippy, fmt, doc (the shared base)
#   - Rust Boundaries     -> scripts/check-crate-boundaries.mjs (the dependency rule)
#   - Conformance         -> npm run check:conformance (shared core against the web shell)
#   - Build              -> scripts: build (next build, output: 'export')
#   - Format             -> scripts: format:check (not switched on yet, see the job)
#   - Dependency Audit   -> npm audit --omit=dev --audit-level=moderate
#
# Node version: 22 — the version with which the reference measurement of
# this round was made (node v22.19.0). Next.js 16 requires >= 20.9.0,
# Vitest 4 supports 20/22/24.

name: CI

on:
  push:
    branches: ['main']
  pull_request:

# Read only — the workflow builds nothing and publishes nothing.
permissions:
  contents: read

# Per branch only the most recent run is computed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vitest (with coverage)
        run: npm run test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        # The HTML reporter is added so that the uploaded report is a real
        # one; `list` keeps the console output readable in the job log.
        run: npm run test:e2e:smoke -- --reporter=html,list
        env:
          # The report must never try to open a browser on the runner.
          PLAYWRIGHT_HTML_OPEN: 'never'
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  catalog-validation:
    name: Catalog Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Song schema validation
        run: npm run validate-songs
      - name: Catalog quality validation
        run: npm run validate-catalog

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `if: always()` makes sure that all four gates are reported —
      # a failed gate still turns the job red.
      - name: Gate — i18n completeness
        if: always()
        run: npm run check:i18n
      - name: Gate — documentation link check
        if: always()
        run: npm run check:doc-links
      - name: Gate — source file size
        if: always()
        run: npm run check:file-size
      - name: Gate — documentation language
        if: always()
        run: npm run check:doc-language
      - name: Gate — licence consistency
        if: always()
        run: npm run check:license
      - name: Gate — Cloudflare headers
        if: always()
        run: npm run check:cloudflare-headers
      # The link matcher decides whether a catalogue link points at the right
      # song. Its self-test asserts every tolerance against a real catalogue
      # entry: a relaxed rule without an example fails the job.
      - name: Gate — catalogue link matcher (self-test)
        if: always()
        run: npm run check:link-match:test

  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Build the shared core
        run: cargo build --workspace --locked
      # The web shell loads the base over WebAssembly. The module has to be
      # built before the Next.js build, and the build of the module needs the
      # wasm32 target.
      - name: Build the WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-wasm.mjs
      # `cargo test` does not build the cdylib of a bridge. The bridge round
      # trip needs it, so it is built before the tests run.
      - name: Build the bridge artefacts
        run: cargo build --workspace --release --lib
      - name: Test the shared core
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --check
      - name: Documentation
        run: cargo doc --workspace --no-deps

  rust-boundaries:
    name: Rust Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gate — crate boundaries
        run: node scripts/check-crate-boundaries.mjs

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            conformance-${{ runner.os }}-
      # The comparison runs the web shell and the shared Rust core against the
      # same vectors. A difference must be a deliberate one, listed in
      # docs/acceptance/P0-ACCEPTANCE.md.
      - name: Compare the shared core with the web shell
        run: npm run check:conformance

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      # The web shell loads the shared base over WebAssembly, so the module has
      # to exist before the Next.js build. The build of the module needs the
      # wasm32 target and downloads the matching wasm-bindgen.
      - name: Build the WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-wasm.mjs
      - name: Next.js production build
        run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          if-no-files-found: error
          retention-days: 7

  format:
    name: Prettier format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOT SWITCHED ON YET — this job does not block the pipeline.
    #
    # `npm run format:check` is red today: the repository was never
    # Prettier-formatted, and a blanket `prettier --write .` produced 30-60 %
    # longer files in an earlier round. The repository is therefore formatted
    # module by module — with `typecheck && lint && test` green after every
    # module — and only when the last module is done is this flag removed
    # and the job allowed to turn the pipeline red.
    #
    # Until then the job runs and reports the real state of the formatting
    # without blocking anything. Switching it on before that would only
    # produce a permanently red job that somebody has to disable again.
    #
    # Backlog: QA-09 remediation backlog, item 1.8 (the ordering rule for the
    # formatter) and QA-05 §QA-TST-002 ("On the formatter — do this in the
    # right order"), which describes the module-by-module procedure. The
    # procedure itself is a separate, named measure and is not part of this
    # change.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prettier format check
        run: npm run format:check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Only the runtime dependencies are audited: the build and test tools
      # are replaced on a regular basis and do not ship to the players.
      - name: Audit the runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
