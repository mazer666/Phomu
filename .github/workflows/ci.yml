# Phomu — CI (Continuous Integration)
#
# This workflow is the binding technical acceptance. Every job checks
# exactly one property and fails on a real violation.
# There is deliberately no `continue-on-error` and no `|| true`: a violation
# has to turn the job red.
#
# Gates (CONTRACT.md §6, QUALITY.md §2):
#   - Typecheck          -> scripts: typecheck
#   - Lint               -> scripts: lint
#   - Unit Tests         -> scripts: test (Vitest + Coverage)
#   - Catalog Validation -> scripts: validate-songs, validate-catalog
#   - Quality Gates      -> scripts: check:i18n, check:doc-links, check:file-size,
#                         check:doc-language, check:license
#   - Rust Core           -> cargo build, test, clippy, fmt, doc (the shared base)
#   - Rust Boundaries     -> scripts/check-crate-boundaries.mjs (the dependency rule)
#   - Conformance         -> npm run check:conformance (shared core against the web shell)
#   - Build              -> scripts: build (next build, output: 'export')
#
# Node version: 22 — the version with which the reference measurement of
# this round was made (node v22.19.0). Next.js 16 requires >= 20.9.0,
# Vitest 4 supports 20/22/24.

name: CI

on:
  push:
    branches: ['main']
  pull_request:

# Read only — the workflow builds nothing and publishes nothing.
permissions:
  contents: read

# Per branch only the most recent run is computed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vitest (with coverage)
        run: npm run test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  catalog-validation:
    name: Catalog Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Song schema validation
        run: npm run validate-songs
      - name: Catalog quality validation
        run: npm run validate-catalog

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `if: always()` makes sure that all four gates are reported —
      # a failed gate still turns the job red.
      - name: Gate — i18n completeness
        if: always()
        run: npm run check:i18n
      - name: Gate — documentation link check
        if: always()
        run: npm run check:doc-links
      - name: Gate — source file size
        if: always()
        run: npm run check:file-size
      - name: Gate — documentation language
        if: always()
        run: npm run check:doc-language
      - name: Gate — licence consistency
        if: always()
        run: npm run check:license

  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Build the shared core
        run: cargo build --workspace --locked
      # `cargo test` does not build the cdylib of a bridge. The bridge round
      # trip needs it, so it is built before the tests run.
      - name: Build the bridge artefacts
        run: cargo build --workspace --release --lib
      - name: Test the shared core
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --check
      - name: Documentation
        run: cargo doc --workspace --no-deps

  rust-boundaries:
    name: Rust Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gate — crate boundaries
        run: node scripts/check-crate-boundaries.mjs

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            conformance-${{ runner.os }}-
      # The comparison runs the web shell and the shared Rust core against the
      # same vectors. A difference must be a deliberate one, listed in
      # docs/acceptance/P0-ACCEPTANCE.md.
      - name: Compare the shared core with the web shell
        run: npm run check:conformance

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Next.js production build
        run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          if-no-files-found: error
          retention-days: 7
