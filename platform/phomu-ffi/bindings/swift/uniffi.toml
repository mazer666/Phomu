# The Swift profile of the bridge.
#
# WHY a profile per language: the Kotlin and the Swift shells are different
# products with different module structures. The profile is the place where
# the differences are declared; the generator is the same for both
# (docs/design/PLATFORM-ARCHITECTURE.md § 6.1).

[bindings.swift]
# The name of the Swift module the generated code lives in.
module_name = "PhomuBridge"
# The name of the shared library the generated Swift loads.
cdylib_name = "phomu_ffi"
