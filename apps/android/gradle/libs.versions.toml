# The version catalogue of the Android shell.
#
# WHY a catalogue: every version of the shell is pinned in exactly one place,
# so that a review sees the whole toolchain in one file and a change is one
# line (docs/design/PLATFORM-ARCHITECTURE.md § 13.4).
#
# WHY these versions:
#   * AGP 8.11.2 is the newest release of the 8.x line that supports
#     `compileSdk 35` with the platform that is installed here
#     (`platforms;android-35`).
#   * Kotlin 2.2.21 carries the Compose compiler plugin, so the Compose
#     compiler version can never drift away from the Kotlin version.
#   * The Compose BOM 2026.03.01 pins `compose ui 1.10.6`, whose
#     `minCompileSdk` is 35. The BOMs 2026.08.00 and 2026.09.00 pull
#     `compose ui 1.12.1` in, which declares `minCompileSdk 37` and therefore
#     cannot be built against the installed platform.
#   * `activity-compose 1.10.1` is the newest release with
#     `minCompileSdk 35`; `1.11.0` declares `minCompileSdk 36`.
#
# The versions are measured, not estimated: every `minCompileSdk` above was
# read out of the `META-INF/com/android/build/gradle/aar-metadata.properties`
# of the published artefact.

[versions]
agp = "8.11.2"
kotlin = "2.2.21"
composeBom = "2026.03.01"
activityCompose = "1.10.1"
navigationCompose = "2.9.5"
lifecycle = "2.9.4"
coreKtx = "1.16.0"
datastore = "1.1.7"
coroutines = "1.10.2"
jna = "5.17.0"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
gson = "2.11.0"

# The SDK levels of the shell.
#
# WHY 24: the NDK r27 refuses a target below API 21, the Compose libraries
# of the BOM above require API 21 as well, and API 24 is the level from
# which the runtime guarantees the behaviour the shell relies on (the
# `AudioFocusRequest` of API 26 is used conditionally, the immersive mode of
# API 30 is used conditionally). API 24 covers the large majority of the
# active devices.
minSdk = "24"
targetSdk = "35"
compileSdk = "35"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# The Java Native Access library the generated UniFFI bindings use.
#
# WHY the AAR: the generated Kotlin bindings of UniFFI 0.29 call JNA, and on
# Android the native dispatcher of JNA has to ship inside the application.
# The AAR carries `libjnidispatch.so` for every Android ABI; the plain JAR
# carries the desktop dispatcher and is therefore only used by the JVM tests.
jna-android = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-desktop = { module = "net.java.dev.jna:jna", version.ref = "jna" }

junit = { module = "junit:junit", version.ref = "junit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
