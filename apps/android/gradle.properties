# The properties of the Gradle build of the Android shell.
#
# WHY the memory limits are this low: the build runs on a machine with 3 GB
# of RAM and two cores. The Kotlin compiler runs inside the Gradle daemon
# (`kotlin.compiler.execution.strategy=in-process`), so a second daemon would
# not fit next to it.

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
